<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCD Health System</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf5fc;font-family:Segoe UI,Arial;color:#172235}.login{width:min(420px,92%);padding:28px;background:#fff;border:1px solid #dce6ef;border-radius:16px;box-shadow:0 15px 40px #173b5d14}.brand{text-align:center;color:#0757ad}.brand .heart{font-size:38px}.brand h1{margin:5px 0}.brand p{font-size:11px;color:#6d7888;margin:0 0 22px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d8e2eb;border-radius:8px}.btn{width:100%;padding:11px;border:0;border-radius:8px;background:#0757ad;color:#fff;font-weight:700}.foot{text-align:center;font-size:9px;color:#8993a0;margin-top:17px}</style>
<style id="modern-visual-theme">
:root{
  --brand:#1769aa;
  --brand-dark:#0d4775;
  --brand-soft:#eaf4fb;
  --teal:#008f8c;
  --teal-soft:#e8f7f6;
  --purple:#6957a8;
  --purple-soft:#f0edfb;
  --green:#2f8f5b;
  --green-soft:#eaf7ef;
  --orange:#d9822b;
  --orange-soft:#fff3e5;
  --red:#c94b4b;
  --red-soft:#fcecec;
  --ink:#26364a;
  --muted:#718096;
  --line:#dfe7ef;
  --surface:#ffffff;
  --surface-soft:#f7fafc;
  --shadow:0 8px 24px rgba(28,54,84,.08);
}

body{
  background:
    radial-gradient(circle at 92% 8%, rgba(105,87,168,.08), transparent 24%),
    radial-gradient(circle at 12% 88%, rgba(0,143,140,.06), transparent 25%),
    #f4f7fb !important;
  color:var(--ink);
}

.sidebar{
  background:linear-gradient(180deg,#0d4775 0%,#135d91 52%,#1769aa 100%) !important;
  box-shadow:8px 0 28px rgba(16,57,92,.12);
}

.brand-mark{
  background:linear-gradient(135deg,#28a7a0,#1769aa) !important;
  box-shadow:0 7px 18px rgba(0,143,140,.22);
}

.nav a{
  border-radius:10px !important;
  margin:3px 10px !important;
  transition:all .18s ease;
}

.nav a:hover{
  background:rgba(255,255,255,.11) !important;
  transform:translateX(2px);
}

.nav a.active{
  background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.08)) !important;
  box-shadow:inset 3px 0 0 #35b6b0;
}

.main{
  background:transparent !important;
}

.top{
  background:rgba(255,255,255,.90) !important;
  border-bottom:1px solid rgba(223,231,239,.85) !important;
  box-shadow:0 3px 18px rgba(28,54,84,.04);
}

.card{
  background:rgba(255,255,255,.96) !important;
  border:1px solid var(--line) !important;
  box-shadow:var(--shadow) !important;
  border-radius:16px !important;
}

.card .head{
  border-bottom-color:#edf1f5 !important;
}

.btn.primary{
  background:linear-gradient(135deg,#1769aa,#008f8c) !important;
  border:none !important;
  box-shadow:0 6px 14px rgba(23,105,170,.18);
}

.btn.primary:hover{
  filter:brightness(1.04);
  transform:translateY(-1px);
}

.btn.light{
  background:#f5f8fb !important;
  border:1px solid #dce5ee !important;
}

input,select,textarea{
  border:1px solid #d5e0ea !important;
  background:#fbfdff !important;
  border-radius:9px !important;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}

input:focus,select:focus,textarea:focus{
  outline:none !important;
  border-color:#2b8ab7 !important;
  background:#fff !important;
  box-shadow:0 0 0 3px rgba(43,138,183,.10) !important;
}

.kpi{
  border:1px solid var(--line) !important;
  border-radius:15px !important;
  box-shadow:0 6px 18px rgba(28,54,84,.06) !important;
  position:relative;
  overflow:hidden;
}

.kpi:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--brand),var(--teal));
}

.kpi.blue{background:linear-gradient(145deg,#fff,#eef7fd) !important}
.kpi.green{background:linear-gradient(145deg,#fff,#edf8f1) !important}
.kpi.red{background:linear-gradient(145deg,#fff,#fff0f0) !important}
.kpi.orange{background:linear-gradient(145deg,#fff,#fff5e9) !important}

.kpi.green:before{background:var(--green)}
.kpi.red:before{background:var(--red)}
.kpi.orange:before{background:var(--orange)}

.riskbox{
  border-radius:13px !important;
  border:1px solid var(--line) !important;
  box-shadow:0 5px 15px rgba(28,54,84,.05);
}

.riskbox.high{background:linear-gradient(145deg,#fff,#fcecec) !important;border-left:4px solid var(--red) !important}
.riskbox.mod{background:linear-gradient(145deg,#fff,#fff4e7) !important;border-left:4px solid var(--orange) !important}
.riskbox.low{background:linear-gradient(145deg,#fff,#edf8f1) !important;border-left:4px solid var(--green) !important}
.riskbox.wait{background:linear-gradient(145deg,#fff,#f0edfb) !important;border-left:4px solid var(--purple) !important}

.table{
  border-radius:13px !important;
  overflow:hidden;
  border:1px solid var(--line);
}

table thead{
  background:linear-gradient(90deg,#eef5fb,#eef9f8) !important;
}

table th{
  color:#34506a !important;
}

table tbody tr:hover{
  background:#f8fbfd !important;
}

.tabs{
  border-bottom:1px solid #dfe7ef !important;
}

.tab{
  color:#60758a !important;
  border-radius:8px 8px 0 0;
}

.tab.active{
  color:#1769aa !important;
  border-bottom:3px solid #008f8c !important;
  background:#f5fbfb !important;
}

.avatar{
  background:linear-gradient(135deg,#1769aa,#6957a8) !important;
  box-shadow:0 5px 12px rgba(105,87,168,.16);
}

.quick .q{
  border:1px solid #e0e8ef !important;
  border-radius:13px !important;
  background:linear-gradient(145deg,#fff,#f7fafc) !important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.quick .q:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 20px rgba(28,54,84,.08);
  border-color:#bcd5e7 !important;
}

.quick .icon{
  background:linear-gradient(135deg,#e9f4fb,#e9f8f7) !important;
  color:#1769aa !important;
  border-radius:11px !important;
}

.notice{
  background:linear-gradient(90deg,#f1f7fc,#eef9f8) !important;
  border:1px solid #d8e8ee !important;
  border-left:4px solid var(--teal) !important;
}

.empty{
  color:#7a8998 !important;
}

@media (max-width:700px){
  .card{border-radius:13px !important}
}
</style>


<style>
