<style>
body{margin:0;background:#f3f7fa;font-family:Arial;color:#26394b}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d9e4ec;border-radius:16px;padding:26px;box-shadow:0 8px 24px #19375012}

<style>
/* Facility identity layer */
.facility-strip{display:flex;align-items:center;gap:12px;padding:9px 13px;margin:0 0 13px;border:1px solid rgba(207,221,232,.9);border-left:4px solid #1769aa;border-right:4px solid #d95b5b;border-radius:10px;background:rgba(255,255,255,.90);box-shadow:0 4px 16px rgba(24,60,90,.05)}
.facility-strip .facility-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#eaf4fb;color:#1769aa;font-weight:800;font-size:13px;overflow:hidden;flex:0 0 34px}
.facility-strip .facility-mark img{width:100%;height:100%;object-fit:contain}
.facility-strip .facility-name{font-weight:800;color:#164f7d;font-size:13px;line-height:1.15}
.facility-strip .facility-meta{font-size:9px;color:#718096;margin-top:3px;line-height:1.35}
.facility-strip .facility-code{margin-left:auto;font-size:9px;color:#718096;text-align:right}
.facility-heading{padding:16px 18px;margin-bottom:14px;border:1px solid #d8e5ee;border-top:4px solid #1769aa;border-bottom:2px solid #d95b5b;border-radius:12px;background:rgba(255,255,255,.96);text-align:center}
.facility-heading .fh-name{font-size:20px;font-weight:800;color:#164f7d}
.facility-heading .fh-line{font-size:11px;color:#52677b;margin-top:4px}
.facility-heading .fh-title{font-size:14px;font-weight:800;color:#26364a;margin-top:10px}
.facility-heading .fh-sub{font-size:10px;color:#718096;margin-top:3px}
.facility-heading{padding:16px 18px;margin-bottom:14px;border:1px solid #d8e5ee;border-top:4px solid #1769aa;border-bottom:2px solid #d95b5b;border-radius:12px;background:rgba(255,255,255,.96);text-align:center}.facility-heading .fh-name{font-size:20px;font-weight:800;color:#164f7d}.facility-heading .fh-line{font-size:10px;color:#52677b;margin-top:4px}.facility-heading .fh-title{font-size:13px;font-weight:800;color:#26364a;margin-top:9px}.facility-heading .fh-sub{font-size:9px;color:#718096;margin-top:3px}
</style>

</head><body>
<div class="wrap"><div class="facility-heading" id="facilityReportHeading">
<div class="fh-name" data-facility-name>SCD Health Facility</div>
<div class="fh-line" data-facility-tagline>Sickle Cell Health Services</div>
<div class="fh-line" data-facility-location></div>
<div class="fh-line" data-facility-contact></div>
<div class="fh-title">Facility Report</div>
<div class="fh-sub" data-facility-code></div>
</div><div class="card">
<h1>Facility Reports</h1><div class="sub">Select the report and reporting period. The report is generated separately from the dashboard.</div>
<div class="grid">
<div><label>Report</label><select id="report"><option value="">Select report</option><option>Monthly SCD Report</option><option>Quarterly SCD Report</option><option>Annual SCD Report</option><option>Patient Registration Summary</option><option>Clinic Attendance</option><option>Clinical Visits</option><option>Pain Crisis Summary</option><option>Laboratory Investigations</option><option>Medication and Treatment Summary</option><option>Blood Transfusion Summary</option><option>Vaccination Summary</option><option>Appointments and Follow-up</option><option>Referrals</option><option>Admissions</option><option>Mortality Report</option></select></div>
<div><label>Unit</label><select id="unit"><option>All Units</option><option>Sickle Cell Clinic</option><option>Outpatient</option><option>Laboratory</option><option>Inpatient</option><option>Blood Transfusion</option></select></div>
<div><label>From</label><input id="from" type="date"></div>
<div><label>To</label><input id="to" type="date"></div>
</div>
<div class="actions"><button class="generate" onclick="generate()">Generate Report</button> <button class="back" onclick="location.href='dashboard.html'">Back to Dashboard</button></div>
<div class="preview" id="preview"><iframe id="frame" title="Facility report"></iframe></div>
</div></div>
<script>
function generate(){
 const report=document.getElementById('report').value;
 const unit=document.getElementById('unit').value;
 const from=document.getElementById('from').value;
 const to=document.getElementById('to').value;
 if(!report||!from||!to){alert('Select a report and date range first.');return;}
 document.getElementById('frame').src='facility-report.php?report='+encodeURIComponent(report)+'&unit='+encodeURIComponent(unit)+'&from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to);
 document.getElementById('preview').style.display='block';
 document.getElementById('preview').scrollIntoView({behavior:'smooth'});
}
</script>
<script src="facility-settings.js"></script>
</body></html>
